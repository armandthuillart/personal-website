name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: DEBUG token diagnostics
        run: |
          curl -s -o /dev/null -w "list PRs: %{http_code}\n" -H "Authorization: bearer ${{ github.token }}" "https://api.github.com/repos/${{ github.repository }}/pulls?state=open"
          curl -s -H "Authorization: bearer ${{ github.token }}" "https://api.github.com/repos/${{ github.repository }}/pulls?state=open"
          echo
          curl -s -o /dev/null -w "repo: %{http_code}\n" -H "Authorization: bearer ${{ github.token }}" "https://api.github.com/repos/${{ github.repository }}"

      - uses: changesets/action@v2
        with:
          publish-script: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
